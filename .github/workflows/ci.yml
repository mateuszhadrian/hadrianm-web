name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  e2e:
    needs: quality
    runs-on: ubuntu-latest
    # Normalny czas joba: ~13 min (install z cache 1–3 min + e2e + visual).
    # Backstop na zawieszenia infrastruktury (apt/CDN wisiały >1h, 2026-07-13).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Playwright version (klucz cache)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Feedy packages.microsoft.com bywają zepsute (błędy podpisów „NOSPLIT",
      # incydent 2026-07-07) i wywracają apt-get w `--with-deps`, a nie są
      # potrzebne — Playwright bierze zależności z repozytoriów Ubuntu.
      - name: Wyłącz feedy packages.microsoft.com (flaky)
        run: sudo bash -c 'grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r rm -f'
      # Z cache 1–3 min; zimny cache (bump Playwrighta) do ~6 min. Dłużej =
      # zawieszony apt/CDN — lepiej ubić i zrobić rerun niż czekać godzinę.
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
        timeout-minutes: 10
      - run: pnpm test:e2e
      # Testy wizualne: baseline'y *-linux.png w repo (aktualizacja TYLKO
      # przez workflow update-visual-baselines.yml — patrz .claude/rules/testing.md)
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Progi ratchet w lighthouserc* (baseline zmierzony na runnerze,
      # run 28884218254). Ponowny pomiar median (przy ratchecie po
      # optymalizacjach): lhci collect --numberOfRuns=5 + scripts/lhci-median.mjs
      # — procedura w analizie §III.5.
      - name: LHCI — mobile
        run: pnpm exec lhci autorun --config=lighthouserc.cjs
      - name: LHCI — desktop
        run: |
          rm -rf .lighthouseci
          pnpm exec lhci autorun --config=lighthouserc.desktop.cjs
