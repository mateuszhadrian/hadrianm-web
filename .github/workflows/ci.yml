name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Ręczne odpalenie z zakładki Actions. Przy awarii GitHuba webhooki bywają
  # odrzucane (2026-08-06: „processing approximately 15% of webhooks"), więc
  # push i otwarcie PR-a NIE tworzą biegu, a odrzuconych zdarzeń GitHub nie
  # odtwarza — bez tego wyzwalacza zostaje pusty commit (C2).
  workflow_dispatch:
jobs:
  quality:
    # Przypięty obraz zamiast `ubuntu-latest` (C3): GitHub przełącza `latest`
    # bez naszej decyzji (2026-10-19); wersja systemu wpływa na binaria
    # Playwrighta i baseline'y linux. Bump = świadoma zmiana, razem z kontrolą
    # baseline'ów (.claude/rules/testing.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build
      # Skan ZBUDOWANEGO dist z treścią produkcyjną (T7): localhost/porty dev,
      # pełne e-maile poza mechanizmem „[ POKAŻ ]", robots.txt + sitemapa na
      # domenie produkcyjnej. Przed uploadem artefaktu — e2e nie dostanie
      # builda, który wyciekł.
      - run: pnpm test:dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  e2e:
    needs: quality
    runs-on: ubuntu-24.04
    # Normalny czas joba: ~20–24 min (install z cache 1–3 min + e2e + visual;
    # 2026-10-26: 23 min). Backstop na zawieszenia infrastruktury (apt/CDN
    # wisiały >1h, 2026-07-13) z miejscem na dwie próby apt (6+6) + binaria (8).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Playwright version (klucz cache)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Feedy packages.microsoft.com bywają zepsute (błędy podpisów „NOSPLIT",
      # incydent 2026-07-07) i wywracają apt-get w `--with-deps`, a nie są
      # potrzebne — Playwright bierze zależności z repozytoriów Ubuntu.
      - name: Wyłącz feedy packages.microsoft.com (flaky)
        run: sudo bash -c 'grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r rm -f'
      # Zależności systemowe (apt) OSOBNO i z drugą próbą: mirror apt na
      # runnerach bywa powolny (2026-10-26: 3× timeout 10 min przy ~40 KB/s
      # z azure.archive.ubuntu.com — 2× main, 1× PR docs-only). Druga
      # próba dociąga resztę z `partial/` (apt wznawia pobieranie), a krótki
      # limit per próba nie pozwala zawieszeniu zjeść całego joba.
      - name: Zależności systemowe Playwrighta (próba 1)
        id: pw-deps
        continue-on-error: true
        timeout-minutes: 6
        run: pnpm exec playwright install-deps chromium webkit firefox
      - name: Zależności systemowe Playwrighta (próba 2)
        if: steps.pw-deps.outcome == 'failure'
        timeout-minutes: 6
        run: pnpm exec playwright install-deps chromium webkit firefox
      # Binaria z cache 1–3 min; zimny cache (bump Playwrighta) do ~6 min.
      - run: pnpm exec playwright install chromium webkit firefox
        timeout-minutes: 8
      # E2E funkcjonalne biegają na dist z treścią PRODUKCYJNĄ (artefakt
      # `quality`; wpisy czytają dynamicznie, więc zmiany z panelu ich nie ruszają).
      - run: pnpm test:e2e
      # Testy wizualne stoją na ZAMROŻONEJ treści (tests/fixtures/realizacje) —
      # inaczej każda realizacja dodana/usunięta w panelu rozjeżdżałaby
      # baseline'y kafli, karuzeli, siatki /realizacje/ i nakładek, blokując
      # wszystkie PR-y. Stąd drugi build (REALIZACJE_DIR); strażnik
      # assertVisualFixture pilnuje, że dist pod zrzutami jest tym właściwym.
      - run: pnpm build:visual
      # Baseline'y *-linux.png w repo (aktualizacja TYLKO przez workflow
      # update-visual-baselines.yml — patrz .claude/rules/testing.md)
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  lighthouse:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Progi ratchet w lighthouserc* (baseline zmierzony na runnerze,
      # run 28884218254). Ponowny pomiar median (przy ratchecie po
      # optymalizacjach): lhci collect --numberOfRuns=5 + scripts/lhci-median.mjs
      # — procedura w analizie §III.5.
      - name: LHCI — mobile
        run: pnpm exec lhci autorun --config=lighthouserc.cjs
      - name: LHCI — desktop
        run: |
          rm -rf .lighthouseci
          pnpm exec lhci autorun --config=lighthouserc.desktop.cjs
