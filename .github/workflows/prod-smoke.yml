# Smoke produkcji po każdym push na main (main = produkcja; deploy robi
# Cloudflare Pages automatycznie). Strategia: zbuduj dist lokalnie, wyciągnij
# zahashowane nazwy assetów i czekaj, aż produkcja zacznie je serwować
# (hash Astro jest deterministyczny dla tej samej treści) — dopiero wtedy
# odpal testy @prod-smoke przeciw https://hadrianm.pl. Porażka = mail
# z GitHuba natychmiast po zepsutym deployu.
name: Prod smoke
on:
  push:
    branches: [main]
  # Ręczne odpalenie z zakładki Actions: smoke bywał czerwony przez wyścig
  # z deployem Cloudflare (rerun), a przy awarii Actions push w ogóle nie
  # tworzy biegu (2026-08-06: GitHub przetwarzał ~15% webhooków; odrzuconych
  # zdarzeń nie odtwarza). Wzorzec z nowszych projektów rodziny (C2).
  workflow_dispatch:
env:
  PROD_URL: https://hadrianm.pl
jobs:
  smoke:
    # Przypięta wersja obrazu (nie `ubuntu-latest`): GitHub przełącza `latest`
    # bez naszej decyzji (2026-10-19), a wersja systemu wpływa na baseline'y
    # linux i binaria Playwrighta. Bump obrazu = świadoma zmiana (C3).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Czekaj na świeży deploy Cloudflare Pages
        run: |
          # KOMPLET assetów z buildu, nie pierwszy z brzegu (C1): pierwszym
          # bywał font o stałym hashu między buildami → strażnik zawsze
          # „świeży" → smoke startował w środku propagacji (nowy HTML, a CSS
          # jeszcze zwracał stronę 404 jako text/html — flake „MIME
          # text/html na _astro/*.css" z katalogu flake'ów). Deploy uznajemy
          # za świeży dopiero, gdy HTML produkcji zawiera WSZYSTKIE assety
          # buildu i KAŻDY z nich odpowiada 200.
          # Wzorzec ucina na spacji i przecinku (srcset/imagesrcset trzymają
          # ścieżkę + deskryptor gęstości w jednej wartości) oraz na
          # apostrofie i nawiasie (inline url('/_astro/…')).
          assets=$(grep -oE "/_astro/[^\"' ,)]+" dist/index.html | sort -u)
          if [ -z "$assets" ]; then
            echo "Nie znalazłem zahashowanych assetów w dist/index.html" >&2
            exit 1
          fi
          echo "Czekam, aż $PROD_URL poda komplet:"
          echo "$assets"
          for i in $(seq 1 30); do
            html=$(curl -s -H "Cache-Control: no-cache" "$PROD_URL/")
            fresh=1
            for a in $assets; do
              # test wbudowany zamiast `echo | grep -q` — grep zamykał potok
              # wcześniej i próby sypały "echo: write error: Broken pipe".
              if [[ "$html" != *"$a"* ]]; then fresh=0; break; fi
              code=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_URL$a")
              if [ "$code" != "200" ]; then fresh=0; break; fi
            done
            if [ "$fresh" = "1" ]; then
              ray=$(curl -sI "$PROD_URL/" | tr -d '\r' | grep -i '^cf-ray' || true)
              echo "Deploy świeży (próba $i; $ray)"
              exit 0
            fi
            echo "  próba $i/30 — build niekompletny na produkcji, czekam 20 s…"
            sleep 20
          done
          echo "Timeout (10 min): produkcja nadal nie serwuje kompletu assetów" >&2
          exit 1
      - name: Playwright version (klucz cache)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Jak w ci.yml: feedy packages.microsoft.com bywają zepsute i nie są potrzebne.
      - name: Wyłącz feedy packages.microsoft.com (flaky)
        run: sudo bash -c 'grep -rl packages.microsoft.com /etc/apt/sources.list.d/ | xargs -r rm -f'
      # Jak w ci.yml: zależności apt osobno z drugą próbą, która CZEKA na
      # apt z próby 1 (limit kroku nie zabija `sudo apt-get`; P-72, DEC-111),
      # binaria osobno z cache.
      - name: Zależności systemowe Playwrighta (próba 1)
        id: pw-deps
        continue-on-error: true
        timeout-minutes: 6
        run: pnpm exec playwright install-deps chromium webkit firefox
      - name: Zależności systemowe Playwrighta (próba 2)
        if: steps.pw-deps.outcome == 'failure'
        timeout-minutes: 8
        run: |
          echo 'DPkg::Lock::Timeout "420";' | sudo tee /etc/apt/apt.conf.d/99pw-lock-timeout
          pnpm exec playwright install-deps chromium webkit firefox
      - run: pnpm exec playwright install chromium webkit firefox
        timeout-minutes: 8
      - run: pnpm test:smoke:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prod-smoke-report
          path: playwright-report/
