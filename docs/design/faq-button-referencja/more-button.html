<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button „Zobacz wszystkie pytania" (referencja)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="more-button.css">
</head>
<body>
<script>document.body.classList.add('js');</script>

<!-- ═══════════════════ BLOK „WIĘCEJ" ═══════════════════
     Domknięcie teasera FAQ na stronie głównej: nadpis z licznikiem
     + button prowadzący do pełnej podstrony /faq.
     Licznik i nadpis są sterowane z data-* na .fq-all (more-button.js);
     bez JS pokazują wartości wpisane w markupie. -->
<div class="fq-demo-stage">
  <div class="fq-more">
    <span class="lead" data-tpl="Pokazano {shown} z {total} pytań">Pokazano 6 z 30 pytań</span>
    <a class="fq-all" href="/faq" data-shown="6" data-total="30">
      <span class="count">06 / 30</span>
      <span class="label">Zobacz wszystkie pytania</span>
      <span class="arr" aria-hidden="true">→</span>
    </a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="more-button.js"></script>
</body>
</html>
