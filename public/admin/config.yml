# ── Gdzie zapisywana jest treść ──────────────────────────────────────────
backend:
  name: github
  repo: mateuszhadrian/hadrianm-web # właściciel/nazwa repo
  branch: main
  # Worker-logowania (OAuth proxy) — wdrożony w Etapie 3:
  base_url: https://sveltia-cms-auth.tenhadrian.workers.dev
  # Bez tego panel odpalony na localhoście wysyła site_id=cms.netlify.com
  # (dziedzictwo Netlify w Sveltii) i wpada na ALLOWED_DOMAINS Workera
  # (gotcha z projektów klienckich rodziny; backlog M1).
  site_domain: hadrianm.pl

# ── Gdzie trafiają media: Cloudflare R2 (Etap 5) ──────────────────────────
# Secret Access Key NIE trafia do tego pliku — Sveltia poprosi o niego
# w panelu przy pierwszym uploadzie i trzyma go w pamięci przeglądarki.
# Upload do R2 działa przez pola `image` ORAZ `file` (MP4 — potwierdzone
# w projektach klienckich rodziny); biblioteka Assets poza polem NIE
# trafia do R2.
media_libraries:
  # Nazwy WGRYWANYCH plików przez te same reguły co slug wpisu (blok `slug:`
  # niżej): spacje → myślniki, polskie znaki transliterowane, małe litery.
  # Bez tego plik z telefonu ląduje w R2 jako "Img 9635.mp4". Zakres `all`
  # obejmuje też upload do R2 (opcja obecna w binarium 0.170.0 — sprawdzone
  # grep-em 2026-10-20). Nazw plików już wgranych NIE zmienia.
  all:
    slugify_filename: true
  cloudflare_r2:
    account_id: "a1f687532595bb8659c557adba293d53"
    access_key_id: "d73ebcace4b956ef8a1a4dee8cb77712"
    bucket: "hadrianm-media"
    public_url: "https://media.hadrianm.pl" # własna domena z 8.1
    prefix: "realizacje/" # pliki wewnątrz bucketa w podfolderze
    jurisdiction: "eu"

# ── Czyste JSON-y: pomijaj niewypełnione pola opcjonalne (np. liveUrl) ────
output:
  omit_empty_optional_fields: true

# ── Nazwy plików wpisów: zawsze czyste ASCII ─────────────────────────────
# Nazwa pliku powstaje z pola „Slug", wpisywanego ręcznie — tekst wklejony
# z telefonu / aplikacji Apple bywa w formie ROZŁOŻONEJ (NFD: „ą" = „a"
# + ogonek). Wygląda identycznie, ale to inne bajty: na macOS git trzyma
# w indeksie nazwę NFD, a z dysku czyta NFC, więc ten sam plik widać dwa
# razy; `git add .` zrobiłby z tego DWA wpisy na Linuksie i wywrócił test
# unikalności slugów (incydent w projekcie klienckim rodziny 2026-08-06).
# `clean_accents` transliteruje polskie znaki (ą→a, ł→l, …), `encoding:
# ascii` wycina resztę. Dotyczy WYŁĄCZNIE nazwy pliku — wartość pola „Slug"
# i treść zostają. Istniejących plików nie rusza.
slug:
  encoding: "ascii"
  clean_accents: true

# ── Dwujęzyczność panelu jest zrobiona przez pola {pl,en} (patrz niżej) ───

collections:
  - name: "realizacje"
    label: "Realizacje"
    label_singular: "Realizacja"
    folder: "src/content/realizacje" # tu leżą pliki JSON z Etapu 1
    extension: "json"
    format: "json"
    create: true # pozwól DODAWAĆ nowe realizacje
    delete: true # pozwól USUWAĆ realizacje
    identifier_field: "name" # co pokazać na liście wpisów
    slug: "{{fields.slug}}" # nazwa pliku = wartość pola slug
    summary: "{{fields.name}} ({{fields.year}})"
    fields:
      - { label: "Slug (adres, np. aura)", name: "slug", widget: "string" }
      - {
          label: "Kolejność (mniejsze = wyżej)",
          name: "order",
          widget: "number",
          value_type: "int",
          default: 10,
        }
      - { label: "Nazwa", name: "name", widget: "string" }
      - { label: "Rok", name: "year", widget: "string" }

      # ── Pola tłumaczone: object z podpolami pl/en ──
      - label: "Kategoria"
        name: "category"
        widget: "object"
        fields:
          - { label: "Polski", name: "pl", widget: "string" }
          - { label: "English", name: "en", widget: "string" }

      - label: "Krótki opis (blurb)"
        name: "blurb"
        widget: "object"
        fields:
          - { label: "Polski", name: "pl", widget: "text" }
          - { label: "English", name: "en", widget: "text" }

      # min/max — strona pokazuje maks. 3 tagi (limit zgodny ze schematem Zod
      # .max(3)); `min` w parze, bo w Decap/Sveltii `max` bez `min` bywa ignorowane
      - label: "Tagi (maks. 3)"
        name: "tags"
        widget: "object"
        fields:
          - {
              label: "Polski",
              name: "pl",
              widget: "list",
              min: 1,
              max: 3,
              field: { label: "Tag", name: "tag", widget: "string" },
            }
          - {
              label: "English",
              name: "en",
              widget: "list",
              min: 1,
              max: 3,
              field: { label: "Tag", name: "tag", widget: "string" },
            }

      - label: "Wprowadzenie (intro)"
        name: "intro"
        widget: "object"
        fields:
          - { label: "Polski", name: "pl", widget: "text" }
          - { label: "English", name: "en", widget: "text" }

      # ── Ekrany: lista, każdy ma DWA zrzuty (desktop + mobile) ──
      - label: "Ekrany (podgląd na urządzeniach)"
        name: "screens"
        widget: "list"
        label_singular: "Ekran"
        min: 1 # schemat Zod wymaga ≥1 ekranu; kafelek bierze obraz z ekranu „home"
        summary: "{{fields.label.pl}}"
        fields:
          - {
              label: "Klucz (home/gallery/order)",
              name: "key",
              widget: "string",
            }
          - label: "Etykieta"
            name: "label"
            widget: "object"
            fields:
              - { label: "Polski", name: "pl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - { label: "Zrzut DESKTOP", name: "desktop", widget: "image" }
          - { label: "Zrzut MOBILE", name: "mobile", widget: "image" }
          # ── Pętla wideo ekranu (OPCJONALNA) — plan: docs/analiza-realizacje-wideo.md
          # Oba pliki NARAZ (laptop + telefon) albo żaden. Wyłącznie nagrania ze
          # skryptu `pnpm capture:site` (1440×900 / 390×800, ≤ 800 KB, pętla bez
          # szwu); widget `file` wgrywa MP4 prosto do R2 (prefix realizacje/).
          # Zdjęcia wyżej zostają: są posterem i wersją dla reduce-motion —
          # najlepiej wgraj tam postery .webp z tego samego nagrania (klatka 0).
          - label: "Wideo ekranu — opcjonalne (tylko z pnpm capture:site)"
            name: "video"
            widget: "object"
            required: false
            fields:
              - {
                  label: "MP4 LAPTOP (…-desktop.mp4)",
                  name: "desktop",
                  widget: "file",
                  hint: "Nagranie 1440×900 ze skryptu capture:site. Bez tego pola brak pętli — zostaje zdjęcie.",
                }
              - {
                  label: "MP4 TELEFON (…-mobile.mp4)",
                  name: "mobile",
                  widget: "file",
                  hint: "Nagranie 390×800 z tego samego uruchomienia skryptu.",
                }

      # ── Liczby i wyniki (OPCJONALNE — R2 backlogu ewolucji) ──
      # Bez zmierzonych metryk zostaw listę pustą: blok „Liczby i wyniki"
      # nie pokaże się w podglądzie (zero zmyślonych liczb). 1–2 pozycje =
      # siatka na tyle kolumn, ile wyników.
      - label: "Wyniki (liczby) — opcjonalne"
        name: "results"
        widget: "list"
        label_singular: "Wynik"
        required: false
        fields:
          - label: "Metryka"
            name: "metric"
            widget: "object"
            fields:
              - { label: "Polski", name: "pl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }
          - label: "Opis"
            name: "label"
            widget: "object"
            fields:
              - { label: "Polski", name: "pl", widget: "string" }
              - { label: "English", name: "en", widget: "string" }

      # ── Opinia (OPCJONALNA — R2) ──
      # Bez cytatu blok opinii nie istnieje w podglądzie. Jeśli cytat jest,
      # wypełnij OBA języki (schemat wymaga pary pl/en); autor i rola też
      # opcjonalne — bez autora cytat renderuje się bez podpisu.
      - label: "Cytat / opinia — opcjonalny"
        name: "quote"
        widget: "object"
        required: false
        fields:
          - { label: "Polski", name: "pl", widget: "text" }
          - { label: "English", name: "en", widget: "text" }
      - {
          label: "Autor opinii — opcjonalny",
          name: "author",
          widget: "string",
          required: false,
        }
      - label: "Rola autora — opcjonalna"
        name: "role"
        widget: "object"
        required: false
        fields:
          - { label: "Polski", name: "pl", widget: "string" }
          - { label: "English", name: "en", widget: "string" }

      # ── Zakres prac ──
      - label: "Zakres prac (scope)"
        name: "scope"
        widget: "object"
        fields:
          - {
              label: "Polski",
              name: "pl",
              widget: "list",
              field: { label: "Punkt", name: "item", widget: "string" },
            }
          - {
              label: "English",
              name: "en",
              widget: "list",
              field: { label: "Item", name: "item", widget: "string" },
            }

      - {
          label: "Link do strony na żywo (opcjonalny)",
          name: "liveUrl",
          widget: "string",
          required: false,
        }
